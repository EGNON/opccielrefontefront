<!--begin::Careers - Apply-->
<div class="card">
  <!--begin::Body-->
  <div class="card-body p-lg-5">
    <!--begin::Layout-->
    <div class="d-flex flex-column flex-lg-row mb-0">
      <!--begin::Content-->
      <div class="flex-lg-row-fluid me-0 me-lg-0">
        <!--begin::Form-->
        <form [formGroup]="entityForm" class="form mb-5">
          <input *ngIf="id" type="hidden" class="form-control form-control-sm form-control-solid" [value]="id" formControlName="id"/>
          <!--begin::Input group-->
          <fieldset class="border rounded-3 p-3">
            <legend class="float-none w-auto px-3">Exercice</legend>
            <div class="row mb-5">              
              <div class="col-md-3 fv-row">
                <!--begin::Label-->
                <label class="fs-5 fw-semibold mb-2">Exercice</label>
                <!--end::Label-->
                <ng-multiselect-dropdown
                  [settings]="exerciceSettings"
                  [placeholder]="'Sélectionnez un exercice'"
                  formControlName="exercice"
                  [data]="exercice"
                  [disabled]="false"
                  (onFilterChange)="onFilterChange($event)"
                  (onDropDownClose)="onDropDownClose($event)"
                  (onSelect)="onItemSelect($event)"
                  (onDeSelect)="onDeSelect($event)"
                  (onSelectAll)="onSelectAll($event)"
                  (onDeSelectAll)="onDeSelectAll($event)">
                </ng-multiselect-dropdown>
              </div>
            </div>
          </fieldset>
          <div class="row mb-5">
            <!--begin::Col-->
            <div class="col-md-4 fv-row">
              <!--begin::Label-->
              <label class="required fs-5 fw-semibold mb-2">Date estimation</label>
              <!--end::Label-->
              <!--begin::Input-->
              <div class="input-group mb-0">
                <!--begin::Input-->
                <input type="text" class="form-control form-control-sm form-control-solid"
                       placeholder="dd-mm-yyyy" ngbDatepicker #d="ngbDatepicker" aria-label="Date ordre" aria-describedby="basic-addon6"
                       formControlName="dateMiseEnAffectation"/>
                <!--end::Input-->
                <span (click)="d.toggle()" class="btn btn-sm btn-outline-secondary input-group-text" id="basic-addon6">
                      <i class="ki-duotone ki-calendar fs-4"><span class="path1"></span><span class="path2"></span></i>
                  </span>
              </div>

            </div>
          </div>
    
            <div class="row mb-5">
              <!--begin::Col-->
              <div class="col-md-4 fv-row">
                <!--begin::Label-->
                <label class=" fs-5 fw-semibold mb-2">RESULTAT</label>
                <!--end::Label-->
                <!--begin::Input-->
                <input [readOnly]="true" appNombreDecimal type="text" class="form-control form-control-sm"
                       placeholder="Ex : XXXXXXXXX" formControlName="resultat"
                />
                <!--end::Select-->

              </div>
              <!--end::Col-->
              <!--begin::Col-->
              <div class="col-md-4 fv-row">
                <label class=" fs-5 fw-semibold mb-2">REG. RESULTAT EN INSTANCE D'AFFECTATION</label>
                <!--begin::Label-->
                <input [readOnly]="true" appNombreDecimal type="text" class="form-control form-control-sm"
                       placeholder="Ex : XXXXXXXXX" formControlName="regBeneInstAffectation"
                />
                <!--end::Col-->
              </div>
              <div class="col-md-4 fv-row">
                <!--begin::Label-->
                <label class=" fs-5 fw-semibold mb-2">MONTANT EN INSTANCE D'AFFECTATION</label>
                <!--end::Label-->
                <!--begin::Input-->
                <input [readOnly]="true" appNombreDecimal type="text" class="form-control form-control-sm"
                       placeholder="Ex : XXXXXXXXX" formControlName="beneInstAffectation"
                />
                <!--end::Input-->
              </div>
              <!--end::Col-->
             
            </div>

            <div class="row mb-5">
               <!--begin::Col-->
              <div class="col-md-4 fv-row">
                <!--begin::Label-->
                <label class="fs-5 fw-semibold mb-2">NOMBRE PART EN CIRCULATION</label>
                <!--end::Label-->
                <!--begin::Input-->
                <input [readOnly]="true" appNombreDecimal type="text" class="form-control form-control-sm"
                       placeholder="Ex : XXXXXXXXX" formControlName="nbrePartEnCirculation"
                />
                <!--end::Input-->
              </div>
              <!--begin::Col-->
              <div class="col-md-4 fv-row">
                <!--begin::Label-->
                <label class=" fs-5 fw-semibold mb-2">COUPON UNITAIRE DISTRIBUABLE</label>
                <!--end::Label-->
                <!--begin::Input-->
                <input [readOnly]="true" appNombreDecimal type="text" class="form-control form-control-sm"
                       placeholder="Ex : XXXXXXXXX" formControlName="coupDivUnitaire"
                />
                <!--end::Select-->
              </div>
            </div>
            <!--end::Input group-->
          <!--begin::Separator-->
          <div class="separator mb-8"></div>
          <!--end::Separator-->
          <!--begin::Action buttons-->
          <div class="d-flex justify-content-end">
            <!--begin::Button-->
            <button [disabled]="enabledBouton" class="btn btn-sm btn-success" (click)="calculer()" >
                <ng-container *ngIf="precalculBouton">
                    <span class="indicator-progress" [style.display]="'block'">
                        Patientez svp...
                        <span class="spinner-border spinner-border-sm align-middle ms-2"></span>
                    </span>
                </ng-container>
                <ng-container *ngIf="!precalculBouton">
                    <span class="indicator-label">Précalculer</span>
                </ng-container>
            </button>
            <!--end::Button-->
            <!--begin::Submit-->
            <button [disabled]="enabledBouton" style="margin-left: 5px;" type="submit" class="btn btn-sm btn-primary" (click)="onSaveEntity()"
                    >
              <ng-container *ngIf="saveBouton">
                    <span class="indicator-progress" [style.display]="'block'">
                        Patientez svp...
                        <span class="spinner-border spinner-border-sm align-middle ms-2"></span>
                    </span>
                </ng-container>
                <ng-container *ngIf="!saveBouton">
                    <span class="indicator-label">Enregistrer</span>
                </ng-container>
            </button>
            <!--end::Submit-->
          </div>
          <!--end::Action buttons-->
        </form>
        <!--end::Form-->
      </div>
      <!--end::Content-->
    </div>
    <!--end::Layout-->
  </div>
  <!--end::Body-->
</div>
<!--end::Careers - Apply-->
