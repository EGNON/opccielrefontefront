<!--begin::Body-->
    <div class="card-body p-lg-5">
        <!--begin::Layout-->
        <div class="d-flex flex-column flex-lg-row mb-0">
        <!--begin::Content-->
        <div class="flex-lg-row-fluid me-0 me-lg-0">
            <!--begin::Form-->
            <form [formGroup]="form" enctype="multipart/form-data" class="form mb-5">
                <div class="card-toolbar"></div>
                    <div class="row mb-5">
              <!--begin::Col-->
             <div class="col-md-3 fv-row">
                <!--begin::Label-->
                <label class="fs-5 fw-semibold mb-2">Exercice</label>
                <!--end::Label-->
                <ng-multiselect-dropdown
                  [settings]="exerciceSettings"
                  [placeholder]="'Sélectionnez un exercice'"
                  formControlName="exercice"
                  [data]="exercice"
                  [disabled]="false"
                  (onFilterChange)="onFilterChange($event)"
                  (onDropDownClose)="onDropDownClose($event)"
                  (onSelect)="onItemSelect($event)"
                  (onDeSelect)="onDeSelect($event)"
                  (onSelectAll)="onSelectAll($event)"
                  (onDeSelectAll)="onDeSelectAll($event)">
                </ng-multiselect-dropdown>
              </div>
              <!--end::Col-->
              
            </div>
               <!--begin::Col-->
              <!--end::Col-->
                    <div class="d-flex justify-content-end">
                        <button [type]="submitting ? 'button' : 'submit'" class="btn btn-sm btn-primary me-3" (click)="submitting ? null : actualiser()">
                            <ng-container *ngIf="submitting">
                        <span class="indicator-progress" [style.display]="'block'">
                            Patientez svp...
                            <span class="spinner-border spinner-border-sm align-middle ms-2"></span>
                        </span>
                            </ng-container>
                            <ng-container *ngIf="!submitting">
                            <span class="indicator-label">Précalculer</span>
                            </ng-container>
                        </button>
                        <button  type="button" class="btn btn-sm btn-info me-3" (click)="generatePdf()">
                            <ng-container *ngIf="downloading">
                            <span class="indicator-progress" [style.display]="'block'">
                                Patientez svp...
                                <span class="spinner-border spinner-border-sm align-middle ms-2"></span>
                            </span>
                            </ng-container>
                            <ng-container *ngIf="!downloading">
                            <span class="indicator-label">Imprimer</span>
                            </ng-container>
                        </button>
                        <!-- <button  [disabled]="enregsitrer_Enabled" type="button" class="btn btn-sm btn-info me-3" (click)="onSaveEntity()">
                            <ng-container *ngIf="saveBouton">
                            <span class="indicator-progress" [style.display]="'block'">
                                Patientez svp...
                                <span class="spinner-border spinner-border-sm align-middle ms-2"></span>
                            </span>
                            </ng-container>
                            <ng-container *ngIf="!saveBouton">
                            <span class="indicator-label">Enregistrer</span>
                            </ng-container>
                        </button> -->
                        <button  type="button" class="btn btn-sm btn-info me-3" (click)="export ? null : exportExcel()">
                            <ng-container *ngIf="export">
                            <span class="indicator-progress" [style.display]="'block'">
                                Patientez svp...
                                <span class="spinner-border spinner-border-sm align-middle ms-2"></span>
                            </span>
                            </ng-container>
                            <ng-container *ngIf="!export">
                            <span class="indicator-label">Exporter</span>
                            </ng-container>
                        </button>
                        <!--<button type="button" class="btn btn-sm btn-warning">
                            <ng-container *ngIf="downloading">
                            <span class="indicator-progress" [style.display]="'block'">
                                Patientez svp...
                                <span class="spinner-border spinner-border-sm align-middle ms-2"></span>
                            </span>
                            </ng-container>
                            <ng-container *ngIf="!downloading">
                            <span class="indicator-label">Envoyer</span>
                            </ng-container>
                        </button>-->
                    </div>
                </form>
                <!--end::Card toolbar-->
                <div class="card-body overflow-auto">
                    <table class="table table-head-custom table-vertical-center overflow-hidden align-middle table-row-dashed fs-6 gy-5" id="table_PointActifPartVL">
                        <thead>
                        <tr class="text-start text-gray-400 fw-bold fs-7 text-uppercase gs-0">
                        <th class="w-10px pe-2">
                            <div class="form-check form-check-sm form-check-custom form-check-solid me-3">
                            <input class="form-check-input" type="checkbox" data-kt-check="true" data-kt-check-target="#kt_ecommerce_products_table .form-check-input" value="1" />
                            </div>
                        </th>
                        <th style="width: 5%">ID</th>
                        <th style="width: 10%">N° COMPTE SGI</th>
                        <th style="width: 50%">ACTIONNAIRE</th>
                        <th style="width: 15%">MONTANT PAYE</th>


                        </tr>
                        </thead>
                        <tbody class="fw-semibold text-gray-600">
                        <tr *ngFor="let precalculPhaseDetachement of phasePAiement$">
                        <!-- -->
                        <td>
<!--              <div class="form-check form-check-sm form-check-custom form-check-solid">-->
                            <input class="form-check-input" type="checkbox" value="1"
                                [(ngModel)]="precalculPhaseDetachement.isSelected" (change)="getIdOperation(precalculPhaseDetachement.isSelected, precalculPhaseDetachement.idOperationPaiement)" />
            <!--              </div>-->
                        </td>
                        <td >{{precalculPhaseDetachement.idActionnaire}}</td>
                        <td >{{ precalculPhaseDetachement.numCompteSgi}}</td>
                        <td >{{ precalculPhaseDetachement.intitule}}</td>
                        <td> {{precalculPhaseDetachement.montantPayer}}</td>
                        <!-- <td>
                            <button class="btn btn-primary btn-sm"
                                    (click)="telechargerDocuments(historiqueVL)">
                            Imprimer
                            </button>
                        </td> -->
                        </tr>
                        </tbody>
                        <!-- <tfoot>
                            <tr class="fw-bold text-dark border-top">
                                <td colspan="2" class="text-end">TOTAL DISTRIBUE</td>
                                <td>{{ totalMontantArecevoir | number:'1.0-2' }}</td>
                                <td  class="text-end">RESTE</td>
                                <td>{{ totalAdistribuer-totalMontantArecevoir | number:'1.0-2' }}</td>
                            </tr>
                        </tfoot> -->
                    </table>
                    
                </div>
            
            <!--end::Form-->
        </div>
        <!--end::Content-->
        </div>
        <!--end::Layout-->
    </div>
<!--end::Body-->
