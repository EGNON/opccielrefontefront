<!--begin::Careers - Apply-->
<div class="card">
  <!--begin::Body-->
  <div class="card-body p-lg-5">
    <!--begin::Layout-->
    <div class="d-flex flex-column flex-lg-row mb-0">
      <!--begin::Content-->
      <div class="flex-lg-row-fluid me-0 me-lg-0">
        <!--begin::Form-->
        <form [formGroup]="entityForm" class="form mb-5">
          <input *ngIf="id" type="hidden" class="form-control form-control-sm form-control-solid" [value]="id" formControlName="id"/>
          <!--begin::Input group-->
          <div class="row mb-5">
            <!--begin::Col-->
            <div class="col-md-6 fv-row">
              <!--begin::Label-->
              <label class="required fs-5 fw-semibold mb-2">Code profil</label>
              <!--end::Label-->
              <!--begin::Input-->
              <input type="text" class="form-control form-control-sm"
                     placeholder="Ex : XXXXXXXXX" formControlName="codeProfil"
                     [ngClass]="{ 'is-invalid': submitted && f.codeProfil.errors }"/>
              <!--end::Input-->
              <div *ngIf="submitted && f.codeProfil.errors" class="invalid-feedback">
                <div *ngIf="f.codeProfil.errors.required">Ce champs est obligatoire</div>
              </div>
            </div>
            <!--end::Col-->
            <!--begin::Col-->
            <div class="col-md-6 fv-row">
              <!--begin::Label-->
              <label class="required fs-5 fw-semibold mb-2">Libellé</label>
              <!--end::Label-->
              <!--begin::Input-->
              <input  type="text" class="form-control form-control-sm"
                     placeholder="Ex : XXXXXXXXX" formControlName="libelleProfil"
                     [ngClass]="{ 'is-invalid': submitted && f.libelleProfil.errors }"/>
              <!--end::Input-->
              <div *ngIf="submitted && f.libelleProfil.errors" class="invalid-feedback">
                <div *ngIf="f.libelleProfil.errors.required">Ce champs est obligatoire</div>
              </div>
            </div>
            <!--end::Col-->
          </div>
          <div class="row mb-5">
            <div class="col-md-6 fv-row">
              <!--begin::Label-->
              <label class="required fs-5 fw-semibold mb-2">Type commission</label>
              <!--end::Label-->
              <!--begin::Select-->
              <select class="form-select form-select-sm mb-2" formControlName="typeCommission"
                      [ngClass]="{ 'is-invalid': submitted && f.typeCommission.errors }">
                <option disabled value="null">Sélectionnez un type commission...</option>
                <option ngValue="RACHAT">RACHAT</option>
                <option ngValue="SOUSCRIPTION">SOUSCRIPTION</option>
              </select>
              <!--end::Select-->
              <div *ngIf="submitted && f.typeCommission.errors" class="invalid-feedback">
                <div *ngIf="f.typeCommission.errors.required">Ce champs est obligatoire</div>
              </div>
            </div>
            <div class="col-md-2 fv-row">
<!--            <div class="d-flex justify-content-end">-->
              <div class="form-check form-check-custom form-check-success form-check-solid form-check-sm ms-10">
                <input type="checkbox" checked="checked" style="margin-top: 35px"
                       formControlName="standard" class="form-check-input ng-untouched ng-pristine ng-valid">
                <label class="form-check-label text-gray-700 fw-bold text-nowrap"
                       style="margin-top: 35px">Standard</label>
              </div>
<!--            </div>-->
            </div>
          </div>
         
<fieldset class="border rounded-3 p-3">
  <legend class="float-none w-auto px-3">Détails</legend>

  <div class="d-flex justify-content-end mb-4">
    <button
      type="button"
      class="btn btn-sm btn-primary"
      (click)="addRow()">
      <i class="ki-duotone ki-plus fs-2"></i>
      Ajouter
    </button>
  </div>

  <div class="table-responsive angular-bootstrap-table">
    <table
      class="table table-head-custom table-vertical-center
             align-middle table-row-dashed fs-6 gy-5">

      <thead>
        <tr class="text-start text-gray-400 fw-bold fs-7 text-uppercase">
          <th class="min-w-150px">Borne inférieure</th>
          <th class="min-w-150px">Borne supérieure</th>
          <th class="min-w-150px">Montant minimum</th>
          <th class="min-w-150px">Taux</th>
          <th class="text-center min-w-100px">Actions</th>
        </tr>
      </thead>

      <tbody class="fw-semibold text-gray-700">

        <tr *ngFor="let detail of details; let i = index">

          <td>
            <input
            type="number"
            class="form-control form-control-sm"
            [value]="detail.borneInferieur"
            readonly>
            <!-- <input
              appNombreDecimal
              type="text"
              class="form-control form-control-sm"
              placeholder="Borne inférieure"
              [value]="detail.borneInferieur ?? ''"
              (input)="detail.borneInferieur = $any($event.target).value"> -->
          </td>

          <td>
            <input
              appNombreDecimal
              type="text"
              class="form-control form-control-sm"
              placeholder="Borne supérieure"
              [value]="detail.borneSuperieur ?? ''"
              (input)="detail.borneSuperieur = $any($event.target).value">
          </td>

          <td>
            <input
              appNombreDecimal
              type="text"
              class="form-control form-control-sm"
              placeholder="Montant minimum"
              [value]="detail.montantMinimum ?? ''"
              (input)="detail.montantMinimum = $any($event.target).value">
          </td>

          <td>
            <input
              appNombreDecimal
              type="text"
              class="form-control form-control-sm"
              placeholder="Taux"
              [value]="detail.taux ?? ''"
              (input)="detail.taux = $any($event.target).value">
          </td>

          <td class="text-center">
            <button
              type="button"
              class="btn btn-icon btn-sm btn-light-danger"
              title="Supprimer cette ligne"
              (click)="removeLine(i)">
              <i class="ki-duotone ki-trash fs-3">
                <span class="path1"></span>
                <span class="path2"></span>
                <span class="path3"></span>
                <span class="path4"></span>
                <span class="path5"></span>
              </i>
            </button>
          </td>

        </tr>

        <tr *ngIf="details.length === 0">
          <td colspan="5" class="text-center text-muted py-5">
            Aucun détail ajouté. Cliquez sur « Ajouter » pour commencer.
          </td>
        </tr>

      </tbody>
    </table>
  </div>
</fieldset>

          <!--begin::Separator-->
          <div class="separator mb-8"></div>
          <!--end::Separator-->
          <!--begin::Action buttons-->
          <div class="d-flex justify-content-end">
            <!--begin::Button-->
            <a type="reset" routerLink="/opcvm/standard/profilopc" class="btn btn-sm btn-light me-3">
              Annuler
            </a>
            <!--end::Button-->
            <!--begin::Submit-->
            <button type="submit" class="btn btn-sm btn-primary" (click)="onSaveEntity()"
                    [disabled]="entityForm.invalid">
              <!--begin::Indicator label-->
              <span class="indicator-label">Enregistrer</span>
              <!--end::Indicator label-->
              <!--begin::Indicator progress-->
              <span *ngIf="submitting" class="indicator-progress">Veuillez patienter svp...
															<span class="spinner-border spinner-border-sm align-middle ms-2"></span></span>
              <!--end::Indicator progress-->
            </button>
            <!--end::Submit-->
          </div>
          <!--end::Action buttons-->
        </form>
        <!--end::Form-->
      </div>
      <!--end::Content-->
    </div>
    <!--end::Layout-->
  </div>
  <!--end::Body-->
</div>
<!--end::Careers - Apply-->
