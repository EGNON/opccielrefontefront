<swal #noticeSwal [swalOptions]="swalOptions"></swal>

<form [formGroup]="critereAlerteForm">
 <input *ngIf="id" type="hidden" class="form-control form-control-sm form-control-solid" [value]="id" formControlName="id"/>
          <!--end::Input-->
          <div class="row mb-5">
            <div class="col-md-6 fv-row">
              <!--begin::Label-->
              <label class="required fs-5 fw-semibold mb-2">Date</label>
              <!--end::Label-->
              <div class="input-group mb-0">
                <!--begin::Input-->
                <input [readonly]="true" type="text" class="form-control form-control-sm form-control-solid"
                       placeholder="dd-mm-yyyy" ngbDatepicker #d="ngbDatepicker" aria-label="Date" aria-describedby="basic-addon6"
                       formControlName="dateAlerte" [ngClass]="{ 'is-invalid': submitted && f.dateAlerte.errors }"/>
                <!--end::Input-->
                <span  class="btn btn-sm btn-outline-secondary input-group-text" id="basic-addon6">
                      <i class="ki-duotone ki-calendar fs-4"><span class="path1"></span><span class="path2"></span></i>
                  </span>
              </div>

              <div *ngIf="submitted && f.dateAlerte.errors" class="invalid-feedback">
                <div *ngIf="f.dateAlerte.errors.required">La date est obligatoire</div>
              </div>
            </div>

            <div [hidden]="true" class="col-md-4 fv-row">
              <label class="required fs-5 fw-semibold mb-2">Etat</label>
              <!--end::Label-->
              <!--begin::Input-->
              <select
                class="form-select form-select-sm form-select-solid"
                formControlName="etat" >
                <option selected>Sélectonnez un état</option>
                <option>Actif </option>
                <option>Inactif</option>
              </select>
            </div>
          </div>

  <!-- ===================== DESCRIPTION ===================== -->
  <div class="card border-0 shadow-sm mb-4">
    <div class="card-body">

      <label class="form-label fw-bold">Description</label>

      <textarea
        type="text"
        class="form-control border border-1 border-secondary-subtle"
        style="height: 80px"
        formControlName="description"
        [ngClass]="{ 'is-invalid': submitted && f.description.errors }">
      </textarea>

      <div *ngIf="submitted && f.description.errors" class="invalid-feedback">
        <div *ngIf="f.description.errors.required">Ce champ est obligatoire</div>
      </div>

    </div>
  </div>

  <!-- ===================== CONSTRUCTION EXPRESSION ===================== -->
  <div class="card border-0 shadow-sm mb-4">

    <div class="card-header bg-light">
      <h5 class="mb-0">Construction de l'expression</h5>
    </div>

    <div class="card-body">

      <div class="alert alert-info d-flex align-items-center mb-4">
        <i class="fas fa-info-circle me-2"></i>
        Construction de la règle d’alerte
      </div>

      <div class="row g-3 align-items-end">

        <!-- Critère -->
        <div class="col-md-3">
          <label class="form-label fw-semibold">Critère(s)</label>
          <select
            class="form-select form-select-solid"
            id="ComboCritere"
            formControlName="critere">

            <option selected>Sélectionnez un critère</option>
            <option>Montant de la transaction</option>
            <option>Quantité de part</option>
            <option>Pays de résidence</option>
            <option>Type de client</option>
            <option>devise</option>
            <option>client</option>

          </select>
        </div>

        <!-- Opérateur -->
        <div class="col-md-2">
          <label class="form-label fw-semibold">Opérateur</label>
          <select
            class="form-select form-select-solid"
            id="ComboOperateur"
            formControlName="operateur">

            <option selected>Sélectionnez</option>
            <option><</option>
            <option>></option>
            <option>=</option>
            <option>>=</option>
            <option><=</option>

          </select>
        </div>

        <!-- Valeur -->
        <div class="col-md-2">
          <label class="form-label fw-semibold">Valeur</label>
          <input
            type="text"
            class="form-control border border-1 border-secondary-subtle"
            id="valeur"
            formControlName="valeur">
        </div>

        <!-- Boutons -->
        <div class="col-md-5">

          <div class="d-flex flex-wrap gap-2">

            <button type="button"
                    class="btn btn-light-primary"
                    (click)="parentheseOuvrante()">
              (
            </button>

            <button type="button"
                    class="btn btn-light-primary"
                    (click)="parentheseFermante()">
              )
            </button>

            <button type="button"
                    class="btn btn-light-success"
                    (click)="et()">
              ET
            </button>

            <button type="button"
                    class="btn btn-light-warning"
                    (click)="ou()">
              OU
            </button>

            <button type="button"
                    class="btn btn-primary"
                    (click)="ajouter()">
              Ajouter
            </button>

          </div>

        </div>

      </div>

    </div>
  </div>

  <!-- ===================== EXPRESSION ===================== -->
  <div class="card border-0 shadow-sm mb-4">

    <div class="card-header d-flex justify-content-between align-items-center bg-light">

      <h5 class="mb-0">Expression</h5>

      <button type="button"
              class="btn btn-sm btn-light-danger"
              (click)="effacer()">
        Effacer
      </button>

    </div>

    <div class="card-body">

      <textarea
        type="text"
        class="form-control border border-1 border-secondary-subtle font-monospace"
        style="height: 90px"
        formControlName="expression"
        id="expression"
        [ngClass]="{ 'is-invalid': submitted && f.expression.errors }">
      </textarea>

      <div *ngIf="submitted && f.expression.errors" class="invalid-feedback">
        <div *ngIf="f.expression.errors.required">Ce champ est obligatoire</div>
      </div>

    </div>
  </div>

  <!-- ===================== ACTIONS ===================== -->
  <div class="card border-0 shadow-sm">

    <div class="card-body d-flex justify-content-end gap-3">

      <a routerLink="/lab/notifications/alertes"
         class="btn btn-light">
        Annuler
      </a>

      <button type="submit"
              class="btn btn-primary"
              (click)="onSaveCritereAlerte()">

        <span class="indicator-label">Enregistrer</span>

        <span *ngIf="submitting" class="indicator-progress">
          Veuillez patienter...
          <span class="spinner-border spinner-border-sm ms-2"></span>
        </span>

      </button>

    </div>

  </div>

</form>
