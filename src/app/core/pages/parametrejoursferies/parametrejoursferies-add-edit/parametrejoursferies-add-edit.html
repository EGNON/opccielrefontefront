<!--begin::Careers - Apply-->
<div class="card">
  <!--begin::Body-->
  <div class="card-body p-lg-5">
    <!--begin::Layout-->
    <div class="d-flex flex-column flex-lg-row mb-0">
      <!--begin::Content-->
      <div class="flex-lg-row-fluid me-0 me-lg-0">
        <!--begin::Form-->
        <form [formGroup]="entityForm" class="form mb-5">
          <!--begin::Input group-->
          <div class="row mb-5">
            <!--begin::Col-->
            <div class="col-md-4 fv-row">
              <!--begin::Label-->
             <label class="required fs-5 fw-semibold mb-2">Date</label>
                <!--end::Label-->

                <div class="input-group mb-0">
                  <!--begin::Input-->
                  <input type="text" class="form-control form-control-sm"
                         placeholder="dd/mm/yyyy" ngbDatepicker #d="ngbDatepicker" aria-label="Date " aria-describedby="basic-addon6"
                         formControlName="date" [ngClass]="{ 'is-invalid': submitted && f.date.errors }"/>
                  <!--end::Input-->
                  <span (click)="d.toggle()" class="btn btn-sm btn-outline-secondary input-group-text" id="basic-addon6">
                      <i class="ki-duotone ki-calendar fs-4"><span class="path1"></span><span class="path2"></span></i>
                  </span>
                </div>

                <div *ngIf="submitted && f.date.errors" class="invalid-feedback">
                  <div *ngIf="f.date.errors.required">La date est obligatoire</div>
                </div>
            </div>
            
            <!--begin::Col-->
            <div class="col-md-4 fv-row">
              <!--begin::Label-->
<!--              <div class="form-check form-check-custom form-check-success form-check-solid form-check-sm ms-10">-->
<!--                <input type="radio" formControlName="ppe1" [value]="false"-->
<!--                       class="form-check-input ng-untouched ng-pristine ng-valid">-->
<!--                <label class="form-check-label text-gray-700 fw-bold text-nowrap">Non</label>-->
<!--              -->
              <label class=" form-check-label text-gray-700 fw-bold text-nowrap" style="margin-top: 35px">
               est annuel
              </label>
              <!--end::Label-->
              <!--begin::Input-->
              <input type="checkbox" class="form-check-input ng-untouched ng-pristine ng-valid"
                     checked   formControlName="estAnnuel" style="margin-top: 35px"
                     [ngClass]="{ 'is-invalid': submitted && f.estAnnuel.errors }"/>
              <!--end::Input-->
              <div *ngIf="submitted && f.estAnnuel.errors" class="invalid-feedback">
                <div *ngIf="f.estAnnuel.errors.required">Ce champs est obligatoire</div>
              </div>
            </div>
            </div>
<!--            </div>-->
            <!--end::Col-->
            <div class="row mb-5">
            <!--begin::Col-->
            <div class="col-md-12 fv-row">
              <!--begin::Label-->
              <label class="required fs-5 fw-semibold mb-2">Description</label>
              <!--end::Label-->
              <!--begin::Input-->
              <input type="text" class="form-control form-control-sm form-control-solid"
                     placeholder="" formControlName="description"
                     [ngClass]="{ 'is-invalid': submitted && f.description.errors }"/>
              <!--end::Input-->
              <div *ngIf="submitted && f.description.errors" class="invalid-feedback">
                <div *ngIf="f.description.errors.required">Ce champs est obligatoire</div>
              </div>
            </div>
            </div>

          
          <!--end::Input group-->
          <!--begin::Separator-->
          <div class="separator mb-8"></div>
          <!--end::Separator-->
          <!--begin::Action buttons-->
          <div class="d-flex justify-content-end">
            <!--begin::Button-->
            <a type="reset" routerLink="/app/standard/parametre/joursferies" class="btn btn-sm btn-light me-3">
              Annuler
            </a>
            <!--end::Button-->
            <!--begin::Submit-->
            <button type="submit" class="btn btn-sm btn-primary" (click)="onSaveEntity()"
                    [disabled]="entityForm.invalid">
              <!--begin::Indicator label-->
              <span class="indicator-label">Enregistrer</span>
              <!--end::Indicator label-->
              <!--begin::Indicator progress-->
              <span *ngIf="submitting" class="indicator-progress">Veuillez patienter svp...
															<span class="spinner-border spinner-border-sm align-middle ms-2"></span></span>
              <!--end::Indicator progress-->
            </button>
            <!--end::Submit-->
          </div>
          <!--end::Action buttons-->
        </form>
        <!--end::Form-->
      </div>
      <!--end::Content-->
    </div>
    <!--end::Layout-->
  </div>
  <!--end::Body-->
</div>
<!--end::Careers - Apply-->
